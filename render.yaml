# Render blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Render creates the database and the web service.
databases:
  - name: triagecare-db
    plan: free
    databaseName: triagecare
    user: triagecare

services:
  - type: web
    name: triagecare
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: triagecare-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_MODE
        value: "true"
