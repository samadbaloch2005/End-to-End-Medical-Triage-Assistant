# Render blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Render builds the Docker image and asks for DATABASE_URL.
#
# The database lives on Neon (https://neon.tech), not Render: Render's free
# Postgres is deleted after 30 days, Neon's free tier does not expire.
# Paste Neon's connection string (postgresql://...?sslmode=require) when asked.

services:
  - type: web
    name: triagecare
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_MODE
        value: "true"
