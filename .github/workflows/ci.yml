name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m triagecare.cli train
      - run: python -m pytest -q

  # Boots the app against real PostgreSQL the way production does
  # (migrate, seed, serve), so Postgres-only problems show up before a deploy.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triagecare
          POSTGRES_PASSWORD: triagecare
          POSTGRES_DB: triagecare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triagecare"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://triagecare:triagecare@localhost:5432/triagecare
      ENVIRONMENT: production
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m triagecare.cli train
      - name: Migrate and seed (twice, to check restarts are safe)
        run: |
          python -m triagecare.cli migrate
          python -m triagecare.cli seed
          python -m triagecare.cli migrate
          python -m triagecare.cli seed
      - name: Serve and check pages
        run: |
          uvicorn triagecare.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/v1/health
          curl -sf -o /dev/null http://127.0.0.1:8000/login
