{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block bare %}
<div style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="card" style="max-width:420px;width:100%">
    <div class="card-body">
      <div class="muted small">Error {{ code }}</div>
      <h1 class="mt-1">{% if code == 404 %}We couldn't find that page{% elif code == 403 %}You don't have access to this{% else %}Something went wrong{% endif %}</h1>
      <p class="muted mt-1">{{ detail }}</p>
      <div class="flex mt-3">
        <a class="btn" href="javascript:history.back()">Go back</a>
        <a class="btn btn-primary" href="/">Overview</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
