{# Stroke icons, 24x24 grid, drawn to match each other. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" -%}<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>
{%- elif name == "queue" -%}<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="1.5"/>
{%- elif name == "patients" -%}<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M17.5 14.3c1.6.6 2.7 2.2 3 4.7"/>
{%- elif name == "calendar" -%}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>
{%- elif name == "bed" -%}<path d="M3 18V7M3 14h18v4M21 14v-2.5A2.5 2.5 0 0 0 18.5 9H11v5"/><circle cx="7" cy="11" r="1.8"/>
{%- elif name == "plus" -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == "users" -%}<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.7 3.6-6 7-6s6.2 2.3 7 6"/>
{%- elif name == "chart" -%}<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>
{%- elif name == "logout" -%}<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>
{%- elif name == "search" -%}<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>
{%- elif name == "pulse" -%}<path d="M3 12h4l2.5-6 4 12 2.5-6h5"/>
{%- elif name == "arrow-left" -%}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "check" -%}<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == "edit" -%}<path d="M4 20h4L19 9l-4-4L4 16z"/>
{%- elif name == "ambulance" -%}<path d="M3 16V8a1 1 0 0 1 1-1h10v9M14 10h4l3 3.5V16h-7"/><circle cx="7" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/><path d="M8.5 9.5v3M7 11h3"/>
{%- elif name == "alert" -%}<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.2M12 17.2v.1"/>
{%- elif name == "lock" -%}<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
{%- elif name == "user" -%}<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.9-3.6 3.9-5.8 7.5-5.8s6.6 2.2 7.5 5.8"/>
{%- elif name == "stethoscope" -%}<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/>
{%- elif name == "heart" -%}<path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/>
{%- elif name == "clipboard" -%}<rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 4.5V3.5h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/>
{%- elif name == "api" -%}<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>
{%- endif -%}
</svg>
{%- endmacro %}
